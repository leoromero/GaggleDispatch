name: generate-symphony-md
description: |
  Use when: You need to create or regenerate the symphony.md self-description for any repository.
  Triggers: "generate symphony", "create symphony.md", "analyze repository and generate symphony",
            "build repository symphony documentation", "create repo symphony", "update symphony.md".
  Does: Takes a language-agnostic snapshot of the repository root, then runs a Claude agent
        that deeply explores the codebase using Read/Glob tools to understand all components,
        their purposes, and their communication patterns — then generates a spec-compliant
        symphony.md with YAML front matter and a Markdown narrative body.
  NOT for: Creating GitHub pull requests, pushing to remote repositories, or any GitHub-dependent workflows.

nodes:
  - id: snapshot-root
    bash: |
      #!/bin/bash
      # Language-agnostic repo snapshot — gives Claude a starting map to explore from.

      echo "=== WORKING DIRECTORY ==="
      pwd

      echo ""
      echo "=== ROOT FILES AND DIRECTORIES ==="
      ls -1A

      echo ""
      echo "=== ALL FILES (max depth 4, excluding build artifacts and dependencies) ==="
      find . \
        -not -path './.git/*' \
        -not -path './node_modules/*' \
        -not -path './.archon/artifacts/*' \
        -not -path './.archon/logs/*' \
        -not -path './target/*' \
        -not -path './dist/*' \
        -not -path './build/*' \
        -not -path './__pycache__/*' \
        -not -path './.venv/*' \
        -not -path './vendor/*' \
        -not -path './.gradle/*' \
        -not -path './bin/*' \
        -maxdepth 4 \
        -type f \
        | sort

  - id: analyze-and-generate
    depends_on: [snapshot-root]
    model: sonnet
    allowed_tools: [Read, Write, Glob]
    prompt: |
      You are a senior engineer generating a `symphony.md` self-description file for this
      repository. The file will be consumed by an automated orchestration system called
      Symphony to route AI agent work to the right repositories.

      Your job is to:
      1. Use the repository snapshot below to identify what kind of codebase this is and
         where the important files are.
      2. Use the Read and Glob tools to explore the repository deeply enough to understand
         every meaningful component, its purpose, and how it communicates with other systems.
      3. Write a spec-compliant symphony.md to the repository root.

      Be thorough. Read source files, not just manifests. The output quality depends on how
      well you understand the actual code.

      ---

      ## REPOSITORY SNAPSHOT

      $snapshot-root.output

      ---

      ## SYMPHONY.MD SPECIFICATION

      The `symphony.md` file has two parts:

      ### PART 1 — YAML FRONT MATTER (required, machine-parsed)

      Delimited by `---` at the top of the file. Contains structured metadata.

      **Required fields:**

      - `name` (string)
        A globally unique kebab-case alias for this repo within the Symphony system.
        Derived from the project name in the manifest file (package.json, Cargo.toml,
        go.mod, pyproject.toml, pom.xml, etc.) or the directory name if no manifest exists.
        Pattern: `[a-z0-9][a-z0-9-]*[a-z0-9]` — lowercase, hyphens only, no leading/trailing hyphens.

      - `description` (string)
        One to three dense sentences: what does this repo do and what is its role in the
        broader system? This is the primary text the Issue Analyzer reads to decide if an
        issue belongs here. Be informative, not generic.

      - `default_workflow` (string)
        Always `symphony/symphony-fix-issue` unless you have specific knowledge of a
        different workflow name for this repo.

      - `components` (list)
        Every meaningful deployable unit, library, service, worker, CLI, API, or data store
        owned by this repository. At least one is required. Each component has:

        - `name` (string, REQUIRED)
          Globally unique kebab-case name. Will be referenced by other repos in their
          `communicates_with` entries. Use a name that reflects the component's identity
          in the broader system (e.g., `patient-ingestion-api`, `auth-worker`, `billing-db`).

        - `description` (string, REQUIRED)
          What this component does. Include enough context for the Issue Analyzer to
          understand which issues affect it.

        - `component_type` (string, RECOMMENDED)
          Choose the best fit from: `ecs_service`, `lambda`, `sqs_queue`, `eventbridge_bus`,
          `redshift`, `healthlake`, `rds`, `shared_lib`, `api_gateway`, `cli`, `worker`,
          `frontend`, `backend`, `other`.
          You may use additional values — they are preserved verbatim.

        - `communicates_with` (list, RECOMMENDED)
          How this component talks to other components or external systems. Each entry:
          - `component` (string, REQUIRED) — kebab-case name of the target component.
            For external systems (AWS services, third-party APIs), use descriptive names
            like `linear-graphql-api`, `anthropic-claude-api`, `sqs-ingestion-queue`.
          - `method` (string, REQUIRED) — mechanism: `sqs`, `http`, `grpc`, `eventbridge`,
            `kinesis`, `library`, `database`, `s3`, `graphql`, `subprocess`, etc.
          - `direction` (string, REQUIRED) — one of:
            `produces`, `consumes`, `reads`, `writes`, `depends_on`, `bidirectional`.

        - `default_workflow` (string, OPTIONAL)
          Per-component workflow override. Set only if this component needs a different
          workflow than the repo-level default.

      **Optional repo-level fields:**

      - `available_workflows` (list of strings)
        All Archon workflows available for this repo. Include `symphony/symphony-fix-issue`
        plus any others you know about.

      **Example front matter:**

      ```yaml
      ---
      name: patient-ingestion-service
      description: >
        Receives HL7 FHIR messages over HTTPS, validates them against schema rules, and
        publishes inbound events to downstream queues for further processing.
        Entry point for all patient data entering the system.
      default_workflow: symphony/symphony-fix-issue
      available_workflows:
        - symphony/symphony-fix-issue
        - symphony/symphony-supervised
      components:
        - name: patient-ingestion-api
          component_type: ecs_service
          description: >
            REST API surface that accepts FHIR payloads from external senders.
            Handles authentication, rate limiting, and initial schema validation
            before forwarding to the ingestion queue.
          communicates_with:
            - component: ingestion-queue
              method: sqs
              direction: produces
            - component: shared-auth-lib
              method: library
              direction: depends_on
        - name: ingestion-queue
          component_type: sqs_queue
          description: >
            SQS queue that buffers validated inbound FHIR messages between the
            ingestion API and the downstream processing workers.
          communicates_with:
            - component: fhir-processor-worker
              method: sqs
              direction: produces
      ---
      ```

      ### PART 2 — MARKDOWN BODY (required, read verbatim by the Issue Analyzer)

      After the closing `---`, write a Markdown narrative covering:

      - The repository's role and purpose in the broader system
      - Key architectural decisions and patterns visible in the code
      - How components interact with each other and with external systems
      - Anything an AI agent needs to know to work effectively in this repo
        (build commands, test strategy, important conventions, gotchas)

      This body is passed verbatim to Claude during issue analysis. Write it as if
      briefing a new senior engineer who will be making changes here.

      ---

      ## INSTRUCTIONS

      1. Start by reading the most informative files first:
         - Manifest files (package.json, Cargo.toml, go.mod, pyproject.toml, pom.xml,
           build.gradle, mix.exs, etc.) for project name, dependencies, and scripts
         - README or docs at the root
         - Entry-point files (main.ts, main.go, main.py, src/index.ts, cmd/, etc.)
         - Source directory structure to identify modules/services

      2. Read enough source files to accurately identify:
         - All distinct components (services, workers, CLIs, libraries, queues, databases)
         - What each component does (its responsibility, not just its name)
         - How components communicate (HTTP calls, queue producers/consumers, imports,
           subprocess spawns, database reads/writes, event emissions, etc.)
         - What external systems or APIs the repo integrates with

      3. Do NOT guess or hallucinate components. Only document what you can verify by
         reading actual source files or configuration.

      4. Write the final symphony.md using the Write tool to the file `symphony.md` in
         the current working directory.

  - id: validate-yaml-frontmatter
    depends_on: [analyze-and-generate]
    script: |
      import { readFileSync } from 'fs';

      const content = readFileSync('symphony.md', 'utf-8');
      const match = content.match(/^---\n([\s\S]*?)\n---/);
      if (!match) throw new Error('No YAML front matter block found in symphony.md');

      const fm = match[1];
      const required = ['name', 'description', 'default_workflow', 'components'];
      const missing = required.filter(f => !new RegExp(`^${f}[:\\s]`, 'm').test(fm));
      if (missing.length > 0) throw new Error(`Missing required front matter fields: ${missing.join(', ')}`);

      const nameMatch = fm.match(/^name:\s*(.+)/m);
      const name = nameMatch?.[1]?.trim() ?? '';
      if (!/^[a-z0-9][a-z0-9-]*[a-z0-9]$/.test(name)) {
        throw new Error(`name "${name}" does not match required pattern [a-z0-9][a-z0-9-]*[a-z0-9]`);
      }

      const componentsCount = (fm.match(/^\s{2}-\s+name:/gm) || []).length;
      if (componentsCount === 0) throw new Error('components list is empty — at least one component is required');

      const workflowsCount = (fm.match(/^\s*-\s+symphony\//gm) || []).length;
      const hasBody = content.split(/\n---\n/)[1]?.trim().length > 0;
      if (!hasBody) throw new Error('Markdown body after front matter is empty');

      console.log('symphony.md validated successfully');
      console.log(`  name:                ${name}`);
      console.log(`  components:          ${componentsCount}`);
      console.log(`  available_workflows: ${workflowsCount}`);
      console.log(`  body:                present`);
    runtime: bun
