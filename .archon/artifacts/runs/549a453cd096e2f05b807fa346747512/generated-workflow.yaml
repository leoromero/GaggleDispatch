name: generate-symphony-md
description: |
  Use when: You need to create or regenerate repository documentation in symphony format.
  Triggers: "generate symphony", "create symphony.md", "analyze repository and generate symphony", "build repository symphony documentation", "create repo symphony"
  Does: Gathers repository context (package.json, README, directory structure), reads the symphony specification schema, generates a symphony.md file with YAML front matter (name, description, default_workflow, components, available_workflows) and a markdown narrative describing the repository's role in the system, then validates the YAML structure.
  NOT for: Creating GitHub pull requests, pushing to remote repositories, or any GitHub-dependent workflows.

nodes:
  - id: gather-repo-context
    bash: |
      #!/bin/bash
      set -e

      echo "=== package.json ==="
      if [ -f package.json ]; then
        cat package.json
      else
        echo "(no package.json found)"
      fi

      echo ""
      echo "=== README.md (first 100 lines) ==="
      if [ -f README.md ]; then
        head -n 100 README.md
      else
        echo "(no README.md found)"
      fi

      echo ""
      echo "=== src/ directory structure ==="
      if [ -d src ]; then
        find src -type f | sort | head -n 100
      else
        echo "(no src/ directory found)"
      fi

      echo ""
      echo "=== Existing symphony.md ==="
      if [ -f symphony.md ]; then
        cat symphony.md
      else
        echo "(no existing symphony.md)"
      fi

  - id: read-spec-schema
    bash: |
      #!/bin/bash
      set -e

      if [ -f SPEC_SYMPHONY.md ]; then
        cat SPEC_SYMPHONY.md
        exit 0
      fi

      for path in ../SPEC_SYMPHONY.md ../../SPEC_SYMPHONY.md; do
        if [ -f "$path" ]; then
          cat "$path"
          exit 0
        fi
      done

      echo "(SPEC_SYMPHONY.md not found — proceeding without it)"

  - id: generate-symphony-content
    depends_on: [gather-repo-context, read-spec-schema]
    model: sonnet
    allowed_tools: [Write, Read, Glob]
    prompt: |
      You are generating a symphony.md file for this repository. This file documents the
      repository's role in a broader system using the symphony specification format.

      ## Repository Context

      $<gather-repo-context>.output

      ## Symphony Specification Schema

      $<read-spec-schema>.output

      ## Your Task

      Generate a complete symphony.md file for this repository and write it to symphony.md
      in the working directory root using the Write tool.

      The file MUST begin with YAML front matter enclosed in --- delimiters containing
      exactly these fields:

        name: <kebab-case alias derived from package.json "name" or the directory name>
        description: <1-3 sentences describing what this repository does>
        default_workflow: symphony/symphony-fix-issue
        components:
          - name: <component name>
            description: <what this component does>
            component_type: <service | library | cli | api | frontend | backend | worker>
            communicates_with:
              - <other component or external service name>
        available_workflows:
          - <workflow name>

      After the closing --- of the front matter, write a Markdown body that includes:
      - A brief narrative describing the repository's role in the broader system
      - Key architectural decisions or patterns visible in the codebase
      - How this repository fits with other components or services

      Derive everything from the repository context above. Write the file now.

  - id: validate-yaml-frontmatter
    depends_on: [generate-symphony-content]
    bash: |
      #!/bin/bash
      set -e

      if [ ! -f symphony.md ]; then
        echo "ERROR: symphony.md was not created"
        exit 1
      fi

      echo "symphony.md exists. Extracting YAML front matter..."

      # Extract content between the first pair of --- delimiters
      FRONTMATTER=$(awk 'BEGIN{found=0} /^---$/{if(found==1){exit} found=1; next} found{print}' symphony.md)

      if [ -z "$FRONTMATTER" ]; then
        echo "ERROR: No YAML front matter block found in symphony.md"
        exit 1
      fi

      echo "--- extracted front matter ---"
      echo "$FRONTMATTER"
      echo "-----------------------------"
      echo ""

      if command -v python3 &>/dev/null; then
        echo "$FRONTMATTER" | python3 - <<'PYEOF'
      import sys, yaml
      data = yaml.safe_load(sys.stdin.read())
      required = ['name', 'description', 'default_workflow', 'components', 'available_workflows']
      missing = [f for f in required if f not in data]
      if missing:
          print(f'ERROR: Missing required fields: {missing}')
          sys.exit(1)
      print('YAML front matter is valid!')
      print(f'  name:                {data.get("name")}')
      print(f'  components:          {len(data.get("components", []))} defined')
      print(f'  available_workflows: {len(data.get("available_workflows", []))} defined')
      PYEOF
      else
        echo "python3 not available — running field presence checks..."
        for field in name description default_workflow components available_workflows; do
          echo "$FRONTMATTER" | grep -q "^${field}:" \
            && echo "OK  $field present" \
            || { echo "ERROR: $field field missing"; exit 1; }
        done
        echo "Basic field validation passed."
      fi

      echo ""
      echo "symphony.md generated and validated successfully."
