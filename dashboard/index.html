<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GaggleDispatch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand">
        <span class="logo">●</span>
        <span class="name">GaggleDispatch</span>
      </div>
      <div id="ws-tabs" class="ws-tabs"></div>
      <div class="stats">
        <span id="slots-stat" class="stat">—</span>
        <span id="tokens-stat" class="stat">—</span>
        <button id="btn-sync" class="nest-btn" title="Import new tickets from the tracker now">⟳ Sync</button>
        <span id="conn-stat" class="stat conn">●</span>
      </div>
    </header>

    <main>
      <section id="gates-panel" class="panel full hidden">
        <div class="panel-header">
          <h2>Waiting for you</h2>
          <span id="gates-count" class="stat"></span>
        </div>
        <div id="gates-list" class="gates-list"></div>
      </section>

      <section id="board-panel" class="panel full">
        <div class="panel-header">
          <h2>Tickets</h2>
          <div class="board-controls">
            <div id="board-filters" class="board-filters"></div>
            <input id="board-search" type="text" placeholder="filter tickets…" />
          </div>
        </div>
        <div id="board-list" class="board-list"></div>
      </section>

      <section id="workers-panel" class="panel wide">
        <h2>Running now</h2>
        <div id="workers-list" class="workers-list"></div>
      </section>

      <section id="repos-panel" class="panel">
        <div class="panel-header">
          <h2>Gaggles</h2>
          <div class="nest-controls">
            <button id="btn-start-all" class="nest-btn start" title="Start all gaggles">▶ All</button>
            <button id="btn-stop-all" class="nest-btn stop" title="Stop all gaggles">■ All</button>
          </div>
        </div>
        <div id="gaggles-list" class="gaggles-list"></div>
      </section>

      <div id="stop-modal" class="modal-overlay hidden">
        <div class="modal">
          <h3 id="modal-title"></h3>
          <p id="modal-body"></p>
          <div class="modal-actions">
            <button id="modal-cancel" class="nest-btn">Cancel</button>
            <button id="modal-stop" class="nest-btn stop">Stop gaggle</button>
          </div>
        </div>
      </div>

      <section id="logs-panel" class="panel full">
        <div class="logs-header">
          <h2>Logs</h2>
          <div class="logs-filters">
            <select id="log-level">
              <option value="">all levels</option>
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
            <input id="log-search" type="text" placeholder="filter messages…" />
            <label class="auto-scroll">
              <input id="autoscroll" type="checkbox" checked /> auto-scroll
            </label>
            <button id="btn-clear-logs" class="nest-btn">Clear</button>
          </div>
        </div>
        <div id="logs-list" class="logs-list"></div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
